<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кото-Кристаллы 💎</title>
    <style>
        :root {
            --tg-bg-color: var(--tg-theme-bg-color, #1a1a2e);
            --tg-text-color: var(--tg-theme-text-color, #ffffff);
            --tg-hint-color: var(--tg-theme-hint-color, #888888);
            --tg-button-color: var(--tg-theme-button-color, #4a9eff);
            --accent-gold: #ffd700;
            --accent-purple: #9d4edd;
            --accent-blue: #4cc9f0;
            --danger-red: #ff006e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, var(--tg-bg-color) 0%, #16213e 100%);
            color: var(--tg-text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
            overflow: hidden;
        }

        .game-container {
            width: 100%;
            max-width: 420px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .title {
            font-size: 2.2em;
            font-weight: bold;
            background: linear-gradient(45deg, var(--accent-gold), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
        }

        .stats {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            gap: 15px;
        }

        .stat-item {
            flex: 1;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 12px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .stat-label {
            font-size: 0.8em;
            opacity: 0.7;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 1.4em;
            font-weight: bold;
        }

        .score-value {
            color: var(--accent-gold);
        }

        .combo-value {
            color: var(--accent-purple);
        }

        .moves-value {
            color: var(--accent-blue);
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-gold), var(--accent-purple));
            width: 0%;
            transition: width 0.5s ease;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }

        #game-board {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 3px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            padding: 10px;
            margin-bottom: 20px;
            position: relative;
        }

        .tile {
            aspect-ratio: 1;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.05));
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.8em;
            cursor: pointer;
            position: relative;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            user-select: none;
        }

        .tile:hover {
            transform: scale(1.05);
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0.1));
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.2);
        }

        .tile.selected {
            transform: scale(0.95);
            box-shadow: 0 0 20px var(--accent-gold), inset 0 0 20px rgba(255, 215, 0, 0.2);
            border: 2px solid var(--accent-gold);
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.2), rgba(255, 215, 0, 0.1));
        }

        .tile.matched {
            animation: matchPulse 0.6s ease-out;
        }

        .tile.falling {
            animation: fallDown 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .tile.special {
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-blue));
            box-shadow: 0 0 15px rgba(157, 78, 221, 0.5);
        }

        .tile.special::after {
            content: '✨';
            position: absolute;
            top: -5px;
            right: -5px;
            font-size: 0.6em;
            animation: sparkle 2s infinite;
        }

        @keyframes matchPulse {
            0% { transform: scale(1); }
            50% { 
                transform: scale(1.3); 
                box-shadow: 0 0 25px var(--accent-gold);
                background: rgba(255, 215, 0, 0.6);
            }
            100% { transform: scale(0); opacity: 0; }
        }

        @keyframes fallDown {
            from { transform: translateY(-100px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        @keyframes sparkle {
            0%, 100% { transform: rotate(0deg) scale(1); opacity: 1; }
            50% { transform: rotate(180deg) scale(1.2); opacity: 0.7; }
        }

        .particle {
            position: absolute;
            pointer-events: none;
            font-size: 1.2em;
            animation: particleFloat 1.5s ease-out forwards;
            z-index: 10;
        }

        @keyframes particleFloat {
            0% { 
                transform: translateY(0) scale(1) rotate(0deg); 
                opacity: 1; 
            }
            100% { 
                transform: translateY(-80px) scale(0.5) rotate(360deg); 
                opacity: 0; 
            }
        }

        .combo-text {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 3em;
            font-weight: bold;
            color: var(--accent-purple);
            text-shadow: 0 0 20px rgba(157, 78, 221, 0.8);
            animation: comboAppear 1.5s ease-out forwards;
            pointer-events: none;
            z-index: 100;
        }

        @keyframes comboAppear {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
            50% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(0.8); opacity: 0; }
        }

        .info {
            text-align: center;
            color: var(--tg-hint-color);
            font-size: 0.9em;
            line-height: 1.4;
        }

        .power-ups {
            display: flex;
            justify-content: space-around;
            margin-bottom: 15px;
        }

        .power-up {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            padding: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .power-up:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .power-up.active {
            background: linear-gradient(135deg, var(--accent-gold), var(--accent-purple));
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.5);
        }

        .level-indicator {
            text-align: center;
            margin-bottom: 10px;
            font-weight: bold;
            color: var(--accent-blue);
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <h1 class="title">Кото-Кристаллы</h1>
            <div class="level-indicator">💰 Золото: <span id="gold">0</span></div>
            <div class="stats">
                <div class="stat-item">
                    <div class="stat-label">Счет</div>
                    <div class="stat-value score-value" id="score">0</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">Комбо</div>
                    <div class="stat-value combo-value" id="combo">0</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">Ходы</div>
                    <div class="stat-value moves-value" id="moves">30</div>
                </div>
            </div>
        </div>

        <div class="power-ups">
            <div class="power-up" id="shuffle-power" title="Перемешать поле (200 очков)">🔄</div>
            <div class="power-up" id="bomb-power" title="Взрыв (150 очков)">💥</div>
            <div class="power-up" id="rainbow-power" title="Радуга (300 очков)">🌈</div>
        </div>

        <div id="game-board"></div>

        <div class="info">
            <p>Собирайте комбинации из 3+ одинаковых предметов!</p>
            <p>10 очков = 1 золото 💰 | Создавайте комбо для больших очков! 🔥</p>
        </div>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Telegram Web App инициализация
            const tg = window.Telegram?.WebApp;
            if (tg) {
                tg.ready();
                tg.MainButton.setText('💰 Забрать заработанное золото');
                tg.MainButton.onClick(finishGame);
                tg.MainButton.hide(); // Скрываем до первых очков
            }

            // Игровые переменные
            const board = document.getElementById('game-board');
            const scoreDisplay = document.getElementById('score');
            const comboDisplay = document.getElementById('combo');
            const movesDisplay = document.getElementById('moves');
            const goldDisplay = document.getElementById('gold');
            
            const width = 8;
            const items = ['🐟', '🧶', '🐭', '🍖', '🥛', '🌿', '💎', '🎁'];
            let grid = [];
            let score = 0;
            let combo = 0;
            let moves = 50; // Увеличиваем ходы для большего заработка
            let selectedTile = null;
            let isProcessing = false;

            // Создание игрового поля
            function createBoard() {
                board.innerHTML = '';
                grid = [];
                
                for (let i = 0; i < width * width; i++) {
                    const tile = document.createElement('div');
                    tile.classList.add('tile');
                    tile.setAttribute('data-id', i);
                    tile.addEventListener('click', onTileClick);
                    
                    let randomItem = items[Math.floor(Math.random() * items.length)];
                    tile.textContent = randomItem;
                    
                    board.appendChild(tile);
                    grid.push(tile);
                }
                
                // Убираем начальные комбинации
                while (checkForInitialMatches()) {
                    shuffleBoard();
                }
            }

            // Проверка начальных комбинаций
            function checkForInitialMatches() {
                for (let i = 0; i < width * width; i++) {
                    if (i % width <= width - 3) {
                        if (grid[i].textContent === grid[i+1].textContent && 
                            grid[i].textContent === grid[i+2].textContent) {
                            return true;
                        }
                    }
                    if (i < width * (width - 2)) {
                        if (grid[i].textContent === grid[i+width].textContent && 
                            grid[i].textContent === grid[i+width*2].textContent) {
                            return true;
                        }
                    }
                }
                return false;
            }

            // Перемешивание поля
            function shuffleBoard() {
                const contents = grid.map(tile => tile.textContent);
                for (let i = contents.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [contents[i], contents[j]] = [contents[j], contents[i]];
                }
                grid.forEach((tile, index) => {
                    tile.textContent = contents[index];
                });
            }

            // Обработка клика
            function onTileClick() {
                if (isProcessing || moves <= 0) return;
                
                const clickedTile = this;

                if (!selectedTile) {
                    selectedTile = clickedTile;
                    selectedTile.classList.add('selected');
                    playSound('select');
                } else if (selectedTile === clickedTile) {
                    selectedTile.classList.remove('selected');
                    selectedTile = null;
                } else {
                    const firstId = parseInt(selectedTile.getAttribute('data-id'));
                    const secondId = parseInt(clickedTile.getAttribute('data-id'));
                    
                    if (isAdjacent(firstId, secondId)) {
                        performSwap(selectedTile, clickedTile);
                    }
                    
                    selectedTile.classList.remove('selected');
                    selectedTile = null;
                }
            }

            // Проверка соседних ячеек
            function isAdjacent(id1, id2) {
                const row1 = Math.floor(id1 / width);
                const col1 = id1 % width;
                const row2 = Math.floor(id2 / width);
                const col2 = id2 % width;
                
                return (Math.abs(row1 - row2) === 1 && col1 === col2) ||
                       (Math.abs(col1 - col2) === 1 && row1 === row2);
            }

            // Выполнение обмена
            async function performSwap(tile1, tile2) {
                isProcessing = true;
                
                const temp = tile1.textContent;
                tile1.textContent = tile2.textContent;
                tile2.textContent = temp;
                
                const matches = await checkForMatches();
                
                if (!matches) {
                    // Возвращаем обратно если нет совпадений
                    const temp = tile1.textContent;
                    tile1.textContent = tile2.textContent;
                    tile2.textContent = temp;
                    playSound('error');
                } else {
                    moves--;
                    movesDisplay.textContent = moves;
                    updateGold(); // Обновляем золото при каждом успешном ходе
                    playSound('match');
                    
                    if (moves <= 0) {
                        setTimeout(checkGameEnd, 1000);
                    }
                    
                    // Показываем кнопку после первых очков
                    if (tg && score > 0) {
                        const gold = Math.floor(score / 10);
                        tg.MainButton.setText(`💰 Забрать ${gold} золота`);
                        tg.MainButton.show();
                    }
                }
                
                isProcessing = false;
            }

            // Проверка совпадений
            async function checkForMatches() {
                let matchFound = false;
                let matchedTiles = new Set();
                
                // Горизонтальные совпадения
                for (let row = 0; row < width; row++) {
                    let count = 1;
                    let currentItem = grid[row * width].textContent;
                    
                    for (let col = 1; col < width; col++) {
                        const index = row * width + col;
                        if (grid[index].textContent === currentItem && currentItem !== '') {
                            count++;
                        } else {
                            if (count >= 3) {
                                for (let i = 0; i < count; i++) {
                                    matchedTiles.add(row * width + col - 1 - i);
                                }
                            }
                            count = 1;
                            currentItem = grid[index].textContent;
                        }
                    }
                    if (count >= 3) {
                        for (let i = 0; i < count; i++) {
                            matchedTiles.add(row * width + width - 1 - i);
                        }
                    }
                }
                
                // Вертикальные совпадения
                for (let col = 0; col < width; col++) {
                    let count = 1;
                    let currentItem = grid[col].textContent;
                    
                    for (let row = 1; row < width; row++) {
                        const index = row * width + col;
                        if (grid[index].textContent === currentItem && currentItem !== '') {
                            count++;
                        } else {
                            if (count >= 3) {
                                for (let i = 0; i < count; i++) {
                                    matchedTiles.add((row - 1 - i) * width + col);
                                }
                            }
                            count = 1;
                            currentItem = grid[index].textContent;
                        }
                    }
                    if (count >= 3) {
                        for (let i = 0; i < count; i++) {
                            matchedTiles.add((width - 1 - i) * width + col);
                        }
                    }
                }
                
                if (matchedTiles.size > 0) {
                    matchFound = true;
                    await animateMatches(matchedTiles);
                    await dropItems();
                    
                    combo++;
                    comboDisplay.textContent = combo;
                    
                    // Показываем комбо текст
                    if (combo > 1) {
                        showComboText();
                    }
                    
                    // Рекурсивная проверка новых совпадений
                    const newMatches = await checkForMatches();
                    if (!newMatches) {
                        combo = 0;
                        comboDisplay.textContent = combo;
                    }
                } else {
                    combo = 0;
                    comboDisplay.textContent = combo;
                }
                
                updateGold(); // Обновляем золото
                return matchFound;
            }

            // Анимация совпадений
            async function animateMatches(matchedTiles) {
                const basePoints = 100;
                const comboMultiplier = Math.max(1, combo);
                const points = basePoints * matchedTiles.size * comboMultiplier;
                
                score += points;
                scoreDisplay.textContent = score;
                
                // Анимация исчезновения
                matchedTiles.forEach(index => {
                    grid[index].classList.add('matched');
                    createParticles(grid[index]);
                });
                
                await new Promise(resolve => setTimeout(resolve, 600));
                
                matchedTiles.forEach(index => {
                    grid[index].textContent = '';
                    grid[index].classList.remove('matched');
                });
            }

            // Создание частиц
            function createParticles(tile) {
                const rect = tile.getBoundingClientRect();
                const particles = ['✨', '💫', '⭐', '🌟'];
                
                for (let i = 0; i < 3; i++) {
                    setTimeout(() => {
                        const particle = document.createElement('div');
                        particle.className = 'particle';
                        particle.textContent = particles[Math.floor(Math.random() * particles.length)];
                        particle.style.left = rect.left + Math.random() * rect.width + 'px';
                        particle.style.top = rect.top + Math.random() * rect.height + 'px';
                        document.body.appendChild(particle);
                        
                        setTimeout(() => particle.remove(), 1500);
                    }, i * 100);
                }
            }

            // Показ текста комбо
            function showComboText() {
                const comboText = document.createElement('div');
                comboText.className = 'combo-text';
                comboText.textContent = `COMBO x${combo}! 🔥`;
                document.body.appendChild(comboText);
                
                setTimeout(() => comboText.remove(), 1500);
            }

            // Падение элементов
            async function dropItems() {
                let dropped = false;
                
                for (let col = 0; col < width; col++) {
                    let emptySpaces = 0;
                    
                    for (let row = width - 1; row >= 0; row--) {
                        const index = row * width + col;
                        
                        if (grid[index].textContent === '') {
                            emptySpaces++;
                        } else if (emptySpaces > 0) {
                            const newIndex = (row + emptySpaces) * width + col;
                            grid[newIndex].textContent = grid[index].textContent;
                            grid[index].textContent = '';
                            grid[newIndex].classList.add('falling');
                            dropped = true;
                            
                            setTimeout(() => {
                                grid[newIndex].classList.remove('falling');
                            }, 800);
                        }
                    }
                    
                    // Заполняем пустые места сверху
                    for (let row = 0; row < width; row++) {
                        const index = row * width + col;
                        if (grid[index].textContent === '') {
                            grid[index].textContent = items[Math.floor(Math.random() * items.length)];
                            grid[index].classList.add('falling');
                            dropped = true;
                            
                            setTimeout(() => {
                                grid[index].classList.remove('falling');
                            }, 800);
                        }
                    }
                }
                
                if (dropped) {
                    await new Promise(resolve => setTimeout(resolve, 500));
                }
            }

            // Обновление золота
            function updateGold() {
                const gold = Math.floor(score / 10); // 1 золото за 10 очков
                goldDisplay.textContent = gold;
                
                // Обновляем текст кнопки
                if (tg && gold > 0) {
                    tg.MainButton.setText(`💰 Забрать ${gold} золота`);
                }
            }

            // Проверка окончания игры
            function checkGameEnd() {
                if (moves <= 0) {
                    const gold = Math.floor(score / 10);
                    const finalText = document.createElement('div');
                    finalText.className = 'combo-text';
                    finalText.textContent = `ИГРА ОКОНЧЕНА! 💰 ${gold}`;
                    finalText.style.fontSize = '2em';
                    document.body.appendChild(finalText);
                    
                    if (tg) {
                        tg.MainButton.setText(`💰 Забрать ${gold} золота!`);
                        tg.MainButton.show();
                    }
                    
                    setTimeout(() => finalText.remove(), 3000);
                }
            }

            // Звуковые эффекты (заглушки)
            function playSound(type) {
                // В реальном приложении здесь были бы звуковые эффекты
                // console.log(`Playing sound: ${type}`);
            }

            // Завершение игры
            function finishGame() {
                // 1. Проверяем, существует ли вообще объект Telegram
                if (!window.Telegram || !window.Telegram.WebApp) {
                    alert("ОШИБКА: Скрипт Telegram не загрузился. Откройте игру через бота.");
                    console.error("Telegram Web App object is not available.");
                    return;
                }

                const tg = window.Telegram.WebApp;
                const gold = Math.floor(score / 10);
                
                const gameData = {
                    score: score,
                    gold: gold,
                    combo_max: Math.max(...[combo]), // Это немного странная конструкция, но она работает. Можно просто: combo
                    moves_used: 50 - moves,
                    timestamp: Date.now()
                };

                // 2. Превращаем данные в строку для отправки
                const dataString = JSON.stringify(gameData);

                // 3. Показываем, ЧТО мы собираемся отправить
                alert(`ПОПЫТКА ОТПРАВКИ ДАННЫХ:\n\n${dataString}`);
                console.log("Attempting to send data:", dataString);

                try {
                    // 4. Главная команда - отправка данных
                    tg.sendData(dataString);
                    
                    // 5. Если код дошел до сюда, значит команда sendData выполнилась без ошибок
                    // Важно: это НЕ значит, что бот их получил, а лишь то, что Telegram их принял на отправку.
                    alert("Команда tg.sendData(data) была вызвана успешно. Теперь игра закроется.");
                    console.log("tg.sendData() was called without throwing an error.");

                    // tg.close(); // sendData должна закрывать приложение сама.
                                // Если игра не закрывается, значит sendData не срабатывает как надо.

                } catch (e) {
                    // 6. Если что-то пошло не так на этапе отправки, мы увидим ошибку
                    alert(`ОШИБКА ПРИ ВЫЗОВЕ tg.sendData():\n\n${e.toString()}`);
                    console.error("Error calling tg.sendData():", e);
                }
            }
            // Бонусы (удешевляем для лучшего игрового опыта)
            document.getElementById('shuffle-power').addEventListener('click', () => {
                if (score >= 200) {
                    score -= 200;
                    scoreDisplay.textContent = score;
                    updateGold();
                    shuffleBoard();
                    playSound('powerup');
                }
            });

            document.getElementById('bomb-power').addEventListener('click', () => {
                if (score >= 150) {
                    score -= 150;
                    scoreDisplay.textContent = score;
                    updateGold();
                    // Взрыв случайной области
                    const centerIndex = Math.floor(Math.random() * (width * width));
                    const bombTiles = [centerIndex];
                    // Добавляем соседние ячейки
                    [-width, -1, 1, width].forEach(offset => {
                        const newIndex = centerIndex + offset;
                        if (newIndex >= 0 && newIndex < width * width) {
                            bombTiles.push(newIndex);
                        }
                    });
                    
                    bombTiles.forEach(index => {
                        if (grid[index]) {
                            grid[index].textContent = '';
                            createParticles(grid[index]);
                        }
                    });
                    
                    setTimeout(() => dropItems(), 500);
                    playSound('bomb');
                }
            });

            document.getElementById('rainbow-power').addEventListener('click', () => {
                if (score >= 300) {
                    score -= 300;
                    scoreDisplay.textContent = score;
                    updateGold();
                    // Уничтожаем все элементы одного типа
                    const targetItem = items[Math.floor(Math.random() * items.length)];
                    grid.forEach(tile => {
                        if (tile.textContent === targetItem) {
                            tile.textContent = '';
                            createParticles(tile);
                        }
                    });
                    
                    setTimeout(() => dropItems(), 500);
                    playSound('rainbow');
                }
            });

            // Инициализация игры
            createBoard();
        });
    </script>
</body>
</html>
